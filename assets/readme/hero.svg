<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">SSH Dock</title>
  <desc id="d">SSH Dock, a server launcher for the Omarchy bar. A panel lists servers from ssh config with a live session dot and an alert light on one server.</desc>
  <rect width="1200" height="400" rx="26" fill="#242b30"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="25.5" fill="none" stroke="#3b464d"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <g transform="translate(64 60)">
      <text font-size="16" letter-spacing="3" fill="#8a9a9a">OMARCHY BAR · SSH LAUNCHER</text>
      <text y="92" font-size="84" font-weight="700" fill="#e8dfcc" letter-spacing="-2">SSH Dock</text>
      <text y="150" font-size="26" fill="#b9ad94" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Connect to your servers with a click.</text>
      <text y="186" font-size="26" fill="#b9ad94" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">See which sessions are live.</text>
      <text y="222" font-size="26" font-weight="700" fill="#e0a458" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">Get a light when a server pings you.</text>
      <text y="282" font-size="16" fill="#8a9a9a">omarchy plugin add github.com/moneytosms/omarchy-ssh-dock</text>
    </g>
    <g transform="translate(680 48)">
      <rect width="456" height="304" rx="14" fill="#2c353b" stroke="#5fa8a0" stroke-width="2"/>
      <rect x="24" y="24" width="38" height="34" rx="6" fill="none" stroke="#e8dfcc" stroke-width="2"/>
      <path d="M32 34 L42 41 L32 48" fill="none" stroke="#e8dfcc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M46 49 H54" stroke="#e8dfcc" stroke-width="2.5" stroke-linecap="round"/>
      <text x="76" y="38" font-size="18" font-weight="700" fill="#e8dfcc">SSH Dock</text>
      <text x="76" y="58" font-size="13" letter-spacing="2" fill="#8a9a9a">SERVERS · 3</text>
      <rect x="24" y="84" width="408" height="38" rx="4" fill="none" stroke="#4a565d"/><text x="40" y="108" font-size="15" fill="#6f7d80">Filter servers…</text>
      <g font-size="18" fill="#e8dfcc">
        <circle cx="34" cy="160" r="6" fill="#5fa8a0"/><text x="54" y="166">web01</text><text x="432" y="166" text-anchor="end" font-size="13" fill="#5fa8a0">live</text>
        <path d="M24 188 H432" stroke="#3b464d"/>
        <circle cx="34" cy="216" r="6" fill="#e0a458"/><text x="54" y="222">db01</text><text x="432" y="222" text-anchor="end" font-size="13" fill="#e0a458">alert: backup done</text>
        <path d="M24 244 H432" stroke="#3b464d"/>
        <circle cx="34" cy="272" r="6" fill="#6f7d80"/><text x="54" y="278">staging</text>
      </g>
    </g>
    <text x="1136" y="378" text-anchor="end" font-size="12" fill="#6f7d80">illustrative</text>
  </g>
</svg>
